# Alembic configuration. The database URL is NOT stored here: alembic/env.py
# reads DATABASE_URL from the application settings (.env), so one config
# works for SQLite, MySQL, and PostgreSQL.
#
#   alembic upgrade head          apply all migrations
#   alembic downgrade -1          undo the last migration
#   alembic revision -m "msg"     create an empty migration to fill in
#   alembic current               show the applied revision

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
