# Render Blueprint for Esone: two Python web services, database on Supabase.
#
#   esone-api  FastAPI in backend/. DATABASE_URL is pasted in the dashboard:
#              Supabase *pooler* URI (host *.pooler.supabase.com, session
#              mode, port 5432). ESONE_CORS_ORIGINS must list the frontend URL
#              (https://esone-web.onrender.com). Optional ESONE_CORS_ORIGIN_REGEX
#              for extra origins.
#   esone-web  FastAPI page server in frontend/ (Jinja2 templates, plain CSS,
#              TypeScript compiled to static JS and committed, so no Node is
#              needed at build time). ESONE_WEB_API_URL is the esone-api URL
#              and is read at request time. The frontend holds no secrets.
#
# Variables marked `sync: false` are asked for in the Render dashboard and are
# never stored in git. See backend/README.md for the full walkthrough.

services:
  - type: web
    name: esone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn esone_api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ESONE_ENV
        value: production
      - key: ESONE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ESONE_CORS_ORIGINS
        sync: false
      - key: ESONE_CORS_ORIGIN_REGEX
        sync: false
      - key: ESONE_ADMIN_USERNAME
        sync: false
      - key: ESONE_ADMIN_EMAIL
        sync: false
      - key: ESONE_ADMIN_PASSWORD
        sync: false

  - type: web
    name: esone-web
    runtime: python
    rootDir: frontend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn esone_web.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ESONE_WEB_ENV
        value: production
      - key: ESONE_WEB_API_URL
        sync: false
