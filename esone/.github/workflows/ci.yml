name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (tsc, pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The compiled JS is committed; fail if src/ and static/js have drifted apart.
      - run: npm run build
      - run: git diff --exit-code -- esone_web/static/js || (echo "Compiled JS is stale. Run 'npm run build' in frontend/ and commit." && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q
      # Same command Vercel runs; proves the static export works.
      - run: python build.py --out dist --api-url https://esone-api.example.com
